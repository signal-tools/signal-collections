name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: signal-collections
      - uses: actions/checkout@v6
        with:
          repository: signal-tools/signal
          path: signal
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            signal/package-lock.json
            signal-collections/package-lock.json
      - name: Install and build Signal
        run: npm ci && npm run build
        working-directory: signal
      - name: Install collection dependencies and local peer
        run: npm ci --legacy-peer-deps && npm install --no-save --package-lock=false ../signal
        working-directory: signal-collections
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: signal-collections
      - name: Build
        run: npm run build
        working-directory: signal-collections
      - name: Lint
        run: npm run lint
        working-directory: signal-collections
      - name: Check formatting
        run: npm run format:check
        working-directory: signal-collections
      - name: Test Node and browsers
        run: npm test
        working-directory: signal-collections
      - name: Check package contents
        run: npm run package:check
        working-directory: signal-collections
